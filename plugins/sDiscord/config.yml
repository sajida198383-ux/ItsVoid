presence:
  enabled: true
  status: ONLINE
  intervalSeconds: 60
  activities:
  - Minecraft | %players% players
slash:
  register: true
intents:
  # Privileged intents must ALSO be switched on in the Discord Developer
  # Portal (your application -> Bot -> Privileged Gateway Intents). New bots
  # have them OFF by default. If Discord rejects them (close 4014) sDiscord
  # keeps working without them (slash commands, Minecraft->Discord chat,
  # console) and logs one warning — but Discord->Minecraft chat text needs
  # messageContent, so enable both switches in the portal when you can.
  members: true
  messageContent: true
  # Voice channel events for the AFK rewards module (v1.6.2). NOT
  # privileged: no switch in the Discord Developer Portal is needed.
  voiceStates: true
