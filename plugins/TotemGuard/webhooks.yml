# Webhook Alert Settings
alert:
  # Enable and/or disable the webhook implementation.
  enabled: false

  # Webhook URL: The URL of the webhook to send notifications to.
  url: https://discord.com/api/webhooks/your_webhook_url

  # Client Name: Name of the client.
  name: TotemGuard

  # Webhook Embed color: Color of the webhook embed (in hex).
  color: '#d9b61a'

  # Webhook Title: Brief description about what the webhook is about. (Like Alert, Punishment, etc.)
  title: TotemGuard Alert

  # Webhook Profile Image: Sets the image of the embed's profile.
  profile-image: https://imgur.com/a/9IUVips

  # Webhook Timestamp: Displays the time that this embed was sent at.
  timestamp: true

  # Webhook Footer: Sets the server name as the footer.
  footer: true

# Webhook Punishment Settings
punishment:
  # Enable and/or disable the webhook implementation.
  enabled: false

  # Webhook URL: The URL of the webhook to send notifications to.
  url: https://discord.com/api/webhooks/your_webhook_url

  # Client Name: Name of the client.
  name: TotemGuard

  # Webhook Embed color: Color of the webhook embed (in hex).
  color: '#d60010'

  # Webhook Title: Brief description about what the webhook is about. (Like Alert, Punishment, etc.)
  title: TotemGuard Punishment

  # Webhook Profile Image: Sets the image of the embed's profile.
  profile-image: https://imgur.com/a/9IUVips

  # Webhook Timestamp: Displays the time that this embed was sent at.
  timestamp: true

  # Webhook Footer: Sets the server name as the footer.
  footer: true
